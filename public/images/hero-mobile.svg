<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="縦構図でとらえた4皿の食卓">
  <defs>
    <radialGradient id="hm-table" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="55%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#e9dfcb"/>
    </radialGradient>
    <radialGradient id="hm-plate" cx="40%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f4eee2"/>
      <stop offset="100%" stop-color="#e2d6bc"/>
    </radialGradient>
    <radialGradient id="hm-tomato" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#e6a17e"/>
      <stop offset="55%" stop-color="#cf7350"/>
      <stop offset="100%" stop-color="#a3492f"/>
    </radialGradient>
    <radialGradient id="hm-basil" cx="44%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#a9b98a"/>
      <stop offset="70%" stop-color="#7c8c5e"/>
      <stop offset="100%" stop-color="#5e6d45"/>
    </radialGradient>
    <linearGradient id="hm-eclair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9945f"/>
      <stop offset="55%" stop-color="#a06a3c"/>
      <stop offset="100%" stop-color="#7c4d2a"/>
    </linearGradient>
    <radialGradient id="hm-tart" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#4a2f3a"/>
      <stop offset="60%" stop-color="#2c1a20"/>
      <stop offset="100%" stop-color="#170c10"/>
    </radialGradient>
    <filter id="hm-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="900" height="1400" fill="url(#hm-table)"/>

  <!-- ===== Dish 01: tomato shortcake ===== -->
  <g>
    <circle cx="330" cy="520" r="152" fill="#000" opacity="0.09" filter="url(#hm-shadow)"/>
    <circle cx="330" cy="512" r="150" fill="url(#hm-plate)"/>
    <circle cx="330" cy="512" r="150" fill="none" stroke="#b3986a" stroke-width="1.3" opacity="0.45"/>
    <circle cx="330" cy="512" r="86" fill="url(#hm-tomato)"/>
    <circle cx="298" cy="490" r="12" fill="#8f3223"/>
    <circle cx="352" cy="480" r="9" fill="#8f3223"/>
    <circle cx="330" cy="530" r="10" fill="#8f3223"/>
    <path d="M 378 468 C 400 458 416 468 419 484 C 400 488 386 482 378 468 Z" fill="#5c6b45"/>
  </g>

  <!-- ===== Dish 02: basil mille-crepes ===== -->
  <g>
    <circle cx="600" cy="800" r="132" fill="#000" opacity="0.09" filter="url(#hm-shadow)"/>
    <circle cx="600" cy="792" r="130" fill="url(#hm-plate)"/>
    <circle cx="600" cy="792" r="130" fill="none" stroke="#b3986a" stroke-width="1.3" opacity="0.45"/>
    <circle cx="600" cy="792" r="74" fill="url(#hm-basil)"/>
    <circle cx="600" cy="792" r="56" fill="none" stroke="#f6f1e6" stroke-width="5" opacity="0.5"/>
    <circle cx="600" cy="792" r="38" fill="none" stroke="#f6f1e6" stroke-width="5" opacity="0.5"/>
    <path d="M 638 760 C 662 748 680 758 683 776 C 662 780 646 774 638 760 Z" fill="#5c6b45"/>
  </g>

  <!-- ===== Dish 03: sansho eclair ===== -->
  <g transform="rotate(-5 450 1050)">
    <ellipse cx="450" cy="1062" rx="222" ry="88" fill="#000" opacity="0.1" filter="url(#hm-shadow)"/>
    <ellipse cx="450" cy="1050" rx="222" ry="96" fill="url(#hm-plate)"/>
    <ellipse cx="450" cy="1050" rx="222" ry="96" fill="none" stroke="#b3986a" stroke-width="1.3" opacity="0.45"/>
    <rect x="340" y="1014" width="220" height="66" rx="33" fill="url(#hm-eclair)"/>
    <path d="M 356 1042 C 388 1028 412 1056 444 1042 C 476 1028 500 1056 532 1042"
      stroke="#f6ecd8" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
    <g fill="#3c3220">
      <circle cx="372" cy="1034" r="2.2"/>
      <circle cx="404" cy="1052" r="1.9"/>
      <circle cx="444" cy="1032" r="2.1"/>
      <circle cx="484" cy="1052" r="1.9"/>
      <circle cx="520" cy="1034" r="2"/>
    </g>
  </g>

  <!-- ===== Dish 04: cacao eggplant tart ===== -->
  <g>
    <circle cx="330" cy="1280" r="142" fill="#000" opacity="0.11" filter="url(#hm-shadow)"/>
    <circle cx="330" cy="1270" r="140" fill="url(#hm-plate)"/>
    <circle cx="330" cy="1270" r="140" fill="none" stroke="#b3986a" stroke-width="1.3" opacity="0.45"/>
    <circle cx="330" cy="1270" r="92" fill="#5f4128"/>
    <circle cx="330" cy="1270" r="76" fill="url(#hm-tart)"/>
    <ellipse cx="298" cy="1240" rx="26" ry="10" fill="#ffffff" opacity="0.16"/>
    <path d="M 372 1222 L 400 1214 L 405 1228 L 377 1236 Z" fill="#c7a874" opacity="0.85"/>
  </g>

  <!-- minimal cutlery accent -->
  <g stroke="#a3906c" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="740" y1="1180" x2="740" y2="1320"/>
    <line x1="756" y1="1180" x2="756" y2="1260"/>
  </g>
</svg>
