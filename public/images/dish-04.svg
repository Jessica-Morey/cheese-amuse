<svg viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="カカオとナスの焼きタルト">
  <defs>
    <radialGradient id="d4-bg" cx="50%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#231a1c"/>
      <stop offset="55%" stop-color="#160f10"/>
      <stop offset="100%" stop-color="#0a0708"/>
    </radialGradient>
    <radialGradient id="d4-plate" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3a322c"/>
      <stop offset="70%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1c1815"/>
    </radialGradient>
    <radialGradient id="d4-crust" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8a6440"/>
      <stop offset="100%" stop-color="#5f4128"/>
    </radialGradient>
    <radialGradient id="d4-filling" cx="40%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#4a2f3a"/>
      <stop offset="55%" stop-color="#2c1a20"/>
      <stop offset="100%" stop-color="#170c10"/>
    </radialGradient>
    <radialGradient id="d4-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="d4-blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="d4-blur-bg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#d4-bg)"/>

  <g opacity="0.3" filter="url(#d4-blur-bg)">
    <path d="M 900 300 L 940 380 L 940 430 L 920 430 L 920 380 Z" fill="none" stroke="#8a4a4a" stroke-width="4"/>
    <ellipse cx="930" cy="300" rx="34" ry="46" fill="none" stroke="#8a4a4a" stroke-width="4"/>
  </g>

  <ellipse cx="600" cy="1140" rx="420" ry="86" fill="#000000" opacity="0.5" filter="url(#d4-blur-soft)"/>
  <ellipse cx="600" cy="1080" rx="440" ry="172" fill="url(#d4-plate)"/>
  <ellipse cx="600" cy="1080" rx="440" ry="172" fill="none" stroke="#b3986a" stroke-width="1.5" opacity="0.55"/>

  <ellipse cx="600" cy="1030" rx="200" ry="52" fill="#000000" opacity="0.3" filter="url(#d4-blur-soft)"/>

  <!-- tart crust ring -->
  <ellipse cx="600" cy="990" rx="215" ry="98" fill="url(#d4-crust)"/>
  <!-- filling -->
  <ellipse cx="600" cy="982" rx="182" ry="80" fill="url(#d4-filling)"/>
  <!-- glossy sheen -->
  <ellipse cx="540" cy="950" rx="70" ry="26" fill="url(#d4-gloss)"/>

  <!-- thin gold leaf accent -->
  <path d="M 660 940 L 700 928 L 706 946 L 668 958 Z" fill="#c7a874" opacity="0.8"/>

  <!-- cacao nib scatter -->
  <g fill="#20140f">
    <circle cx="560" cy="1000" r="5" />
    <circle cx="640" cy="1010" r="4.5"/>
    <circle cx="600" cy="960" r="4"/>
    <circle cx="520" cy="970" r="3.6"/>
  </g>
</svg>
