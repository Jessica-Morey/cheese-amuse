<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="4皿の料理を真上から見た食卓">
  <defs>
    <radialGradient id="ho-table" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="60%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#e9dfcb"/>
    </radialGradient>
    <radialGradient id="ho-plate" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f4eee2"/>
      <stop offset="100%" stop-color="#e2d6bc"/>
    </radialGradient>
    <radialGradient id="ho-tomato" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#e6a17e"/>
      <stop offset="55%" stop-color="#cf7350"/>
      <stop offset="100%" stop-color="#a3492f"/>
    </radialGradient>
    <radialGradient id="ho-basil" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#a9b98a"/>
      <stop offset="70%" stop-color="#7c8c5e"/>
      <stop offset="100%" stop-color="#5e6d45"/>
    </radialGradient>
    <linearGradient id="ho-eclair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9945f"/>
      <stop offset="55%" stop-color="#a06a3c"/>
      <stop offset="100%" stop-color="#7c4d2a"/>
    </linearGradient>
    <radialGradient id="ho-tart" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a2f3a"/>
      <stop offset="60%" stop-color="#2c1a20"/>
      <stop offset="100%" stop-color="#170c10"/>
    </radialGradient>
    <filter id="ho-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#ho-table)"/>

  <!-- ===== Dish 01: tomato shortcake, top-left ===== -->
  <g>
    <ellipse cx="410" cy="390" rx="205" ry="205" fill="#000" opacity="0.10" filter="url(#ho-shadow)"/>
    <circle cx="410" cy="380" r="200" fill="url(#ho-plate)"/>
    <circle cx="410" cy="380" r="200" fill="none" stroke="#b3986a" stroke-width="1.4" opacity="0.45"/>
    <circle cx="410" cy="380" r="150" fill="none" stroke="#c9b98f" stroke-width="1" opacity="0.35"/>
    <circle cx="410" cy="380" r="112" fill="url(#ho-tomato)"/>
    <circle cx="368" cy="352" r="16" fill="#8f3223"/>
    <circle cx="440" cy="340" r="12" fill="#8f3223"/>
    <circle cx="410" cy="404" r="13" fill="#8f3223"/>
    <path d="M 470 330 C 498 316 518 328 522 350 C 500 356 480 350 470 330 Z" fill="#5c6b45"/>
  </g>

  <!-- ===== Dish 02: basil mille-crepes, top-right ===== -->
  <g>
    <ellipse cx="1230" cy="270" rx="165" ry="165" fill="#000" opacity="0.10" filter="url(#ho-shadow)"/>
    <circle cx="1230" cy="260" r="160" fill="url(#ho-plate)"/>
    <circle cx="1230" cy="260" r="160" fill="none" stroke="#b3986a" stroke-width="1.4" opacity="0.45"/>
    <circle cx="1230" cy="260" r="92" fill="url(#ho-basil)"/>
    <circle cx="1230" cy="260" r="70" fill="none" stroke="#f6f1e6" stroke-width="6" opacity="0.5"/>
    <circle cx="1230" cy="260" r="48" fill="none" stroke="#f6f1e6" stroke-width="6" opacity="0.5"/>
    <path d="M 1270 220 C 1298 206 1318 218 1322 240 C 1300 246 1280 240 1270 220 Z" fill="#5c6b45"/>
  </g>

  <!-- ===== Dish 03: sansho eclair, elongated plate lower-left/center ===== -->
  <g transform="rotate(-8 800 660)">
    <ellipse cx="800" cy="670" rx="270" ry="120" fill="#000" opacity="0.10" filter="url(#ho-shadow)"/>
    <ellipse cx="800" cy="660" rx="270" ry="118" fill="url(#ho-plate)"/>
    <ellipse cx="800" cy="660" rx="270" ry="118" fill="none" stroke="#b3986a" stroke-width="1.4" opacity="0.45"/>
    <rect x="670" y="622" width="260" height="76" rx="38" fill="url(#ho-eclair)"/>
    <path d="M 690 656 C 730 640 760 674 800 656 C 840 640 870 674 910 656"
      stroke="#f6ecd8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
    <g fill="#3c3220">
      <circle cx="710" cy="648" r="2.6"/>
      <circle cx="750" cy="668" r="2.2"/>
      <circle cx="800" cy="646" r="2.5"/>
      <circle cx="850" cy="668" r="2.2"/>
      <circle cx="890" cy="648" r="2.4"/>
    </g>
  </g>

  <!-- ===== Dish 04: cacao eggplant tart, bottom-right ===== -->
  <g>
    <ellipse cx="1250" cy="760" rx="180" ry="180" fill="#000" opacity="0.12" filter="url(#ho-shadow)"/>
    <circle cx="1250" cy="750" r="175" fill="url(#ho-plate)"/>
    <circle cx="1250" cy="750" r="175" fill="none" stroke="#b3986a" stroke-width="1.4" opacity="0.45"/>
    <circle cx="1250" cy="750" r="118" fill="#5f4128"/>
    <circle cx="1250" cy="750" r="98" fill="url(#ho-tart)"/>
    <ellipse cx="1210" cy="712" rx="34" ry="14" fill="#ffffff" opacity="0.18"/>
    <path d="M 1300 700 L 1332 690 L 1338 706 L 1306 716 Z" fill="#c7a874" opacity="0.85"/>
  </g>

  <!-- ===== Tableware: wine glass (top-down) ===== -->
  <g opacity="0.75">
    <circle cx="1420" cy="150" r="42" fill="none" stroke="#8a7a5a" stroke-width="2.4"/>
    <circle cx="1420" cy="150" r="30" fill="none" stroke="#c9b98f" stroke-width="1.2"/>
  </g>

  <!-- sake cup -->
  <g opacity="0.75">
    <circle cx="1010" cy="500" r="24" fill="none" stroke="#8a7a5a" stroke-width="2.2"/>
  </g>

  <!-- cutlery, thin lines -->
  <g stroke="#a3906c" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="150" y1="560" x2="150" y2="760"/>
    <line x1="130" y1="560" x2="130" y2="640"/>
    <line x1="140" y1="560" x2="140" y2="640"/>
    <line x1="200" y1="560" x2="200" y2="760"/>
  </g>

  <!-- folded napkin -->
  <g transform="rotate(6 170 880)" opacity="0.9">
    <rect x="90" y="840" width="160" height="80" rx="4" fill="#f2ece0"/>
    <line x1="90" y1="870" x2="250" y2="870" stroke="#d9cdb0" stroke-width="1.5"/>
  </g>
</svg>
